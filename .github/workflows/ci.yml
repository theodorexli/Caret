name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-24.04
    env:
      VERCEL_API_GATEWAY_KEY: ${{ secrets.VERCEL_API_GATEWAY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: make test
      - run: python3 scripts/check_sources.py
      - run: python3 -m caret preview --fixture fixtures/meeting.json
  mac:
    name: Mac build
    # SwiftUI's glassEffect requires Xcode 26; Package.swift still targets macOS 14.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned KeyType UI dependency
        run: git submodule update --init --depth 1 packages/keytype
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: swift test --package-path apps/mac
      - name: Build the packaged app
        run: xcodebuild -quiet -project Caret.xcodeproj -scheme Caret -configuration Debug -destination 'platform=macOS' CODE_SIGN_IDENTITY=- build
